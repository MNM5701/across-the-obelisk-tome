<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A powerful deck builder and card explorer for Across the Obelisk. Filter by class, cost, auras, and more.">
    <title>Tome of Knowledge - Across the Obelisk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <header class="app-header">
        <h1>Tome of Knowledge</h1>
        <p>Across the Obelisk Deck Builder</p>
    </header>
    
    <main class="container">
    <div class="build-manager" id="buildManager">
        <div class="build-header">
            <input type="text" id="buildName" placeholder="Name your build...">
            <select id="heroSelect" onchange="changeHero()" style="padding: 10px; border-radius: var(--border-radius-md); border: 1px solid var(--border-light); background: var(--bg-input); color: var(--text-bright); font-weight: 600;">
                <option value="">-- Select Hero --</option>
            </select>
            <button class="btn-green" onclick="saveBuildToLocal()">Save to Computer</button>
            <button class="btn-blue" onclick="generateShareLink()">Generate Link</button>
            <button class="btn-red" onclick="clearBuild()">Clear Build</button>
            <select id="savedBuildsDropdown" onchange="loadBuildFromLocal(this.value)">
                <option value="">-- Load Saved Build --</option>
            </select>
            <button class="btn-red" onclick="deleteSavedBuild()" title="Delete selected build" style="padding: 10px 15px;">🗑️</button>
            <button class="btn-blue" onclick="document.getElementById('buildManager').classList.toggle('pinned')">📌 Pin Panel</button>
        </div>
        
        <div id="shareLinkContainer" style="display:none; margin-top: 15px;">
            <input type="text" id="shareLinkInput" readonly style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #555; background: #111; color: #4ade80;" onclick="this.select()">
            <small style="color: #aaa; display: block; margin-top: 5px;">Link copied to clipboard! Share this URL to send your build.</small>
        </div>

        <div class="build-section-toggle" id="traitsToggle" onclick="this.classList.toggle('collapsed'); document.getElementById('traitsSection').classList.toggle('collapsed')" style="display:none;">
            <h3>Hero Traits</h3>
            <span class="toggle-icon">▼</span>
        </div>
        <div class="build-grid traits-grid" id="traitsSection" style="display:none;">
            <!-- Traits injected here -->
        </div>

        <div class="build-section-toggle" onclick="this.classList.toggle('collapsed'); document.getElementById('equipmentSection').classList.toggle('collapsed')">
            <h3>Equipment</h3>
            <span class="toggle-icon">▼</span>
        </div>
        <div class="build-grid equipment-slots" id="equipmentSection">
            <!-- Equipment injected here -->
        </div>

        <div class="build-section-toggle" onclick="this.classList.toggle('collapsed'); document.getElementById('deckSection').classList.toggle('collapsed')">
            <div style="display: flex; align-items: center; gap: 15px;">
                <h3>Deck</h3>
                <button class="btn-blue" onclick="sortBuildByCost(event)" style="padding: 4px 10px; font-size: 0.85em;">Sort by Cost</button>
            </div>
            <span class="toggle-icon">▼</span>
        </div>
        <div id="trashZone" style="display: none; width: 100%; padding: 20px; background: rgba(239, 68, 68, 0.2); border: 2px dashed #ef4444; text-align: center; color: #ef4444; border-radius: 8px; margin-top: 15px; font-weight: bold; cursor: pointer;" ondragover="allowDrop(event)" ondrop="dropTrash(event)">
            🗑️ DROP HERE TO DELETE ALL COPIES 🗑️
        </div>
        <div class="build-grid" id="deckSection">
            <!-- Deck cards injected here -->
        </div>

        <!-- Metrics Dashboard -->
        <div class="build-metrics" id="buildMetrics" style="display:none;">
            <div class="metric-col">
                <h4>Stats</h4>
                <ul class="metric-list">
                    <li><span>Total Cards:</span> <strong id="metricTotal">0</strong></li>
                    <li><span>Avg Cost:</span> <strong id="metricAvg">0.0</strong></li>
                </ul>
            </div>
            <div class="metric-col">
                <h4>Cost Curve</h4>
                <ul class="metric-list" id="metricCurve"></ul>
            </div>
            <div class="metric-col">
                <h4>Types</h4>
                <ul class="metric-list" id="metricTypes"></ul>
            </div>
            <div class="metric-col" style="flex: 2;">
                <h4>Auras & Curses</h4>
                <div class="badge-container" id="metricEffects"></div>
            </div>
        </div>
    </div>

    <!-- Primary Search & Category -->
    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search cards by name or ID..." oninput="filterData()">
        <select id="categoryFilter" class="main-select" onchange="toggleSubMenu(); filterData()" style="max-width: 200px;">
            <option value="all">All Categories</option>
            <option value="normal" selected>Normal Cards</option>
            <option value="item">Items</option>
        </select>
        <button class="btn-blue" onclick="resetFilters()" style="padding: 10px 15px;">Reset Filters</button>
    </div>

    <!-- Advanced Spreadsheet Filters (Cards) -->
    <div id="advancedFilters" class="sub-menu">
        <div id="classFilterContainer"></div>
        <div id="costFilterContainer"></div>
        <div id="rarityFilterContainer"></div>
        <div id="typeFilterContainer"></div>
        <div id="auraFilterContainer"></div>
        <div id="curseFilterContainer"></div>
    </div>

    <!-- Advanced Spreadsheet Filters (Items) -->
    <div id="itemFilters" class="sub-menu hidden">
        <div id="itemTypeFilterContainer"></div>
        <div id="itemRarityFilterContainer"></div>
        <div id="itemBasicsFilterContainer"></div>
        <div id="itemDamageFilterContainer"></div>
        <div id="itemResistFilterContainer"></div>
        <div id="itemAuraFilterContainer"></div>
        <div id="itemCurseFilterContainer"></div>
    </div>

    <div id="error-message"></div>

    <div class="grid" id="cardGrid">
        <!-- Cards will be injected here -->
    </div>
    </main>

    <script src="./app.js"></script>
</body>
</html>
