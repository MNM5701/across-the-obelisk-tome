<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tome of Knowledge - Across the Obelisk</title>
    <style>
        :root {
            --bg-base: #121212;
            --bg-surface: #1e1e1e;
            --bg-elevated: #2d2d2d;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #3b82f6;
            --border: #374151;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-base); 
            color: var(--text-primary); 
            margin: 0;
            padding: 20px; 
        }

        .controls { 
            display: flex; 
            flex-wrap: wrap;
            gap: 15px; 
            margin-bottom: 30px; 
            background-color: var(--bg-surface); 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        input, select { 
            padding: 10px 15px; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            background-color: var(--bg-base); 
            color: var(--text-primary); 
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        input[type="text"] {
            flex-grow: 1;
            min-width: 200px;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px; 
        }

        .card-container { 
            background-color: var(--bg-surface); 
            padding: 15px; 
            border-radius: 12px; 
            text-align: center; 
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.4);
        }

        .card-title {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            text-transform: capitalize;
            color: var(--text-secondary);
        }
        
        img { 
            max-width: 100%; 
            height: auto; 
            border-radius: 8px; 
            display: block;
            margin: 0 auto;
        }

        .variants { 
            display: flex; 
            gap: 10px; 
            justify-content: center; 
            margin-top: 15px; 
            flex-wrap: wrap; 
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        .variant-img { 
            width: 50px; 
            cursor: pointer; 
            transition: transform 0.2s, opacity 0.2s; 
            opacity: 0.6;
            border-radius: 4px;
        }

        .variant-img:hover, .variant-img.active { 
            transform: scale(1.1); 
            opacity: 1;
        }

        .error-message {
            color: #ef4444;
            text-align: center;
            padding: 20px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 8px;
            border: 1px solid #ef4444;
        }
    </style>
</head>
<body>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search cards by name or ID..." oninput="filterData()">
        
        <select id="typeFilter" onchange="filterData()">
            <option value="all">All Types</option>
            <option value="melee">Melee</option>
            <option value="spell">Spell</option>
            <option value="skill">Skill</option>
            <option value="power">Power</option>
            <option value="attack">Attack</option>
        </select>
    </div>

    <div class="grid" id="cardGrid">
        <!-- Cards will be dynamically injected here -->
    </div>

    <script>
        let allCards = [];

        async function loadData() {
            try {
                // Fetch the JSON metadata
                const response = await fetch('./cards.json'); 
                if (!response.ok) throw new Error("Could not find cards.json");
                
                const db = await response.json();
                
                // Convert the JSON object into a filterable array
                allCards = Object.entries(db.cards).map(([key, data]) => {
                    return {
                        idKey: key, // e.g., "armageddon (corruptor)"
                        variants: data.IDs || [], // e.g., ["armageddon","armageddona","..."]
                        related: data.RelatedIDs || [],
                        type: data.type ? data.type.toLowerCase() : 'unknown',
                        cost: data.cost !== undefined ? data.cost : null
                    };
                });

                // Initial render of all data
                renderCards(allCards);
            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById('cardGrid').innerHTML = `
                    <div class="error-message" style="grid-column: 1 / -1;">
                        <h3>Failed to load cards.json</h3>
                        <p>Make sure you are viewing this through your local web server or GitHub Pages, and that cards.json is in the same folder as index.html.</p>
                        <p>Technical details: ${error.message}</p>
                    </div>`;
            }
        }

        function renderCards(cardsToRender) {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';

            cardsToRender.forEach(card => {
                if (!card.variants || card.variants.length === 0) return;

                const baseId = card.variants[0]; // The standard, un-upgraded card
                const upgrades = card.variants.slice(1); // The a, b, and rare upgrades

                // Create the physical card container
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card-container';
                
                // Build the inner HTML structure
                // Notice the _result appended to the base image string
                let htmlStr = `
                    <h3 class="card-title">${card.idKey}</h3>
                    <img src="./images/${baseId}_result.png" id="main-img-${baseId}" alt="${baseId}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'200\\' height=\\'280\\'><rect width=\\'100%\\' height=\\'100%\\' fill=\\'%23374151\\'/><text x=\\'50%\\' y=\\'50%\\' fill=\\'white\\' text-anchor=\\'middle\\'>Image Not Found</text></svg>'">
                `;
                
                if (upgrades.length > 0) {
                    htmlStr += `<div class="variants">`;
                    
                    // Add the base card as the first clickable variant (to swap back)
                    htmlStr += `
                        <img class="variant-img active" 
                             id="thumb-${baseId}-${baseId}"
                             src="./images/${baseId}_result.png" 
                             onclick="swapImage('${baseId}', '${baseId}')"
                             title="${baseId}">
                    `;
                    
                    // Add all other upgrades
                    upgrades.forEach(upgradeId => {
                        htmlStr += `
                            <img class="variant-img" 
                                 id="thumb-${baseId}-${upgradeId}"
                                 src="./images/${upgradeId}_result.png" 
                                 onclick="swapImage('${baseId}', '${upgradeId}')"
                                 title="${upgradeId}">
                        `;
                    });
                    htmlStr += `</div>`;
                }

                cardDiv.innerHTML = htmlStr;
                grid.appendChild(cardDiv);
            });
        }

        // Handles variant clicking to swap the main image
        function swapImage(baseId, newId) {
            // Update the main image source (handling the _result suffix)
            const mainImg = document.getElementById(`main-img-${baseId}`);
            if (mainImg) {
                mainImg.src = `./images/${newId}_result.png`;
            }

            // Update active state styling on the thumbnails
            const variantsContainer = mainImg.nextElementSibling;
            if (variantsContainer && variantsContainer.classList.contains('variants')) {
                const thumbs = variantsContainer.querySelectorAll('.variant-img');
                thumbs.forEach(thumb => thumb.classList.remove('active'));
                
                const activeThumb = document.getElementById(`thumb-${baseId}-${newId}`);
                if (activeThumb) {
                    activeThumb.classList.add('active');
                }
            }
        }

        // The Filtering Engine
        function filterData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const typeFilter = document.getElementById('typeFilter').value;

            const filtered = allCards.filter(card => {
                // Fuzzy search logic (checks the main key and all variant IDs)
                const matchesSearch = card.idKey.toLowerCase().includes(searchTerm) || 
                                      card.variants.join(' ').toLowerCase().includes(searchTerm);
                
                // Facet matching
                const matchesType = typeFilter === 'all' || card.type.includes(typeFilter);

                return matchesSearch && matchesType;
            });

            renderCards(filtered);
        }

        // Kick off the application
        loadData();
    </script>
</body>
</html>
