<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tome of Knowledge - Across the Obelisk</title>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: #eee; padding: 20px; }
        
        /* Build Manager / Deck Builder */
        .build-manager { background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #444; box-shadow: 0 4px 6px rgba(0,0,0,0.4); }
        .build-header { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .build-header input[type="text"] { padding: 8px; border-radius: 4px; border: 1px solid #555; background: #111; color: white; flex: 1; min-width: 200px; }
        .build-header select { padding: 8px; border-radius: 4px; border: 1px solid #555; background: #111; color: white; }
        .btn-green { padding: 8px 15px; cursor: pointer; background: #4ade80; color: #111; border: none; border-radius: 4px; font-weight: bold; transition: background 0.2s; }
        .btn-green:hover { background: #22c55e; }
        .btn-blue { padding: 8px 15px; cursor: pointer; background: #3b82f6; color: white; border: none; border-radius: 4px; font-weight: bold; transition: background 0.2s; }
        .btn-blue:hover { background: #2563eb; }
        
        .build-grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; min-height: 80px; padding: 10px; background: #222; border-radius: 4px; border: 1px dashed #555; }
        .build-item { position: relative; width: 65px; }
        .build-item img { width: 100%; border-radius: 4px; border: 1px solid #666; }
        .remove-btn { position: absolute; top: -6px; right: -6px; background: #ef4444; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; line-height: 18px; text-align: center; cursor: pointer; border: none; padding: 0; font-weight: bold; }
        .remove-btn:hover { transform: scale(1.1); }

        /* Build Metrics Dashboard */
        .build-metrics { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 15px; padding: 15px; background: #252525; border-radius: 6px; font-size: 0.9em; border: 1px solid #333; }
        .metric-col { flex: 1; min-width: 150px; }
        .metric-col h4 { margin: 0 0 8px 0; color: #4ade80; border-bottom: 1px solid #444; padding-bottom: 4px; }
        .metric-list { margin: 0; padding: 0; list-style: none; color: #ccc; }
        .metric-list li { margin-bottom: 3px; display: flex; justify-content: space-between; }
        .badge-container { display: flex; flex-wrap: wrap; gap: 4px; }
        .badge { background: #333; border: 1px solid #555; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }

        /* Top Level Controls */
        .controls { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; background: #2d2d2d; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .controls input[type="text"], select.main-select { padding: 10px; border-radius: 4px; border: 1px solid #444; background: #111; color: white; width: 100%; max-width: 400px; font-size: 1em; }
        
        /* Advanced Sub-Menu */
        .sub-menu { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; background: #222; padding: 15px; border-radius: 8px; border: 1px solid #333; }
        .sub-menu.hidden { display: none; }
        
        /* Custom Multi-Select Dropdowns */
        .multi-select { position: relative; min-width: 160px; flex: 1; }
        .select-box { padding: 10px; background: #111; border: 1px solid #444; border-radius: 4px; cursor: pointer; color: #ccc; font-size: 0.95em; user-select: none; display: flex; justify-content: space-between; align-items: center; }
        .select-box:after { content: '▼'; font-size: 0.8em; color: #888; }
        .select-box:hover { border-color: #666; }
        .dropdown-content { display: none; position: absolute; top: 100%; left: 0; background: #2d2d2d; width: 100%; max-height: 250px; overflow-y: auto; border: 1px solid #444; z-index: 100; box-shadow: 0 8px 16px rgba(0,0,0,0.5); border-radius: 0 0 4px 4px; }
        .dropdown-content.show { display: block; }
        .dropdown-content label { display: block; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #333; font-size: 0.9em; text-transform: capitalize; }
        .dropdown-content label:hover { background: #3d3d3d; }
        
        /* Grid and Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .card-container { background: #2d2d2d; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display: flex; flex-direction: column; }
        .card-title { margin-top: 0; margin-bottom: 15px; font-size: 1.1em; text-transform: capitalize; color: #ccc; }
        
        .variants { display: flex; gap: 4px; justify-content: center; margin-top: 15px; flex-wrap: wrap; margin-bottom: 15px; }
        .card-container img.main-img { max-width: 100%; height: auto; border-radius: 4px; }
        
        /* Adjusted Variants for 4-across */
        .variant-img { width: 48px; cursor: pointer; transition: transform 0.2s, border 0.2s; border: 2px solid transparent; border-radius: 4px; }
        .variant-img:hover { transform: scale(1.1); }
        .variant-img.active { border: 2px solid #4ade80 !important; }
        
        /* Color Coded Borders */
        .border-a { border: 2px solid rgba(59, 130, 246, 0.4); }      /* Faint Blue */
        .border-b { border: 2px solid rgba(234, 179, 8, 0.4); }       /* Faint Yellow */
        .border-rare { border: 2px solid rgba(168, 85, 247, 0.4); }   /* Faint Purple */
        .border-base { border: 2px solid rgba(255, 255, 255, 0.1); }  /* Very Faint White/Grey */

        .add-btn { margin-top: auto; padding: 8px; background: #444; border: 1px solid #555; color: #eee; border-radius: 4px; cursor: pointer; width: 100%; transition: background 0.2s; font-weight: bold; }
        .add-btn:hover { background: #4ade80; color: #111; border-color: #4ade80; }

        /* Error States */
        .error-state { padding: 40px 10px; background: #333; border-radius: 4px; color: #ff6b6b; font-size: 0.9em; display: flex; align-items: center; justify-content: center; flex-direction: column; min-height: 200px; }
        #error-message { display: none; color: #ff6b6b; background: #333; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 20px; border: 1px solid #ff6b6b; }
    </style>
</head>
<body>

    <!-- Build Manager Area -->
    <div class="build-manager" id="buildManager">
        <div class="build-header">
            <input type="text" id="buildName" placeholder="Name your build...">
            <button class="btn-green" onclick="saveBuildToLocal()">Save to Computer</button>
            <button class="btn-blue" onclick="generateShareLink()">Generate Link</button>
            <select id="savedBuildsDropdown" onchange="loadBuildFromLocal(this.value)">
                <option value="">-- Load Saved Build --</option>
            </select>
        </div>
        
        <div id="shareLinkContainer" style="display:none; margin-top: 15px;">
            <input type="text" id="shareLinkInput" readonly style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #555; background: #111; color: #4ade80;" onclick="this.select()">
            <small style="color: #aaa; display: block; margin-top: 5px;">Link copied to clipboard! Share this URL to send your build.</small>
        </div>

        <div class="build-grid" id="buildGrid">
            <!-- Selected cards inject here -->
        </div>

        <!-- Metrics Dashboard -->
        <div class="build-metrics" id="buildMetrics" style="display:none;">
            <div class="metric-col">
                <h4>Stats</h4>
                <ul class="metric-list">
                    <li><span>Total Cards:</span> <strong id="metricTotal">0</strong></li>
                    <li><span>Avg Cost:</span> <strong id="metricAvg">0.0</strong></li>
                </ul>
            </div>
            <div class="metric-col">
                <h4>Cost Curve</h4>
                <ul class="metric-list" id="metricCurve"></ul>
            </div>
            <div class="metric-col">
                <h4>Types</h4>
                <ul class="metric-list" id="metricTypes"></ul>
            </div>
            <div class="metric-col" style="flex: 2;">
                <h4>Auras & Curses</h4>
                <div class="badge-container" id="metricEffects"></div>
            </div>
        </div>
    </div>

    <!-- Primary Search & Category -->
    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search cards by name or ID..." oninput="filterData()">
        <select id="categoryFilter" class="main-select" onchange="toggleSubMenu(); filterData()">
            <option value="all">All Categories</option>
            <option value="normal" selected>Normal Cards</option>
        </select>
    </div>

    <!-- Advanced Spreadsheet Filters -->
    <div id="advancedFilters" class="sub-menu">
        <div id="classFilterContainer"></div>
        <div id="costFilterContainer"></div>
        <div id="rarityFilterContainer"></div>
        <div id="typeFilterContainer"></div>
        <div id="auraFilterContainer"></div>
        <div id="curseFilterContainer"></div>
    </div>

    <div id="error-message"></div>

    <div class="grid" id="cardGrid">
        <!-- Cards will be injected here -->
    </div>

    <script>
        let allCards = []; 
        let currentBuild = []; 

        // ------------------------------------------------------------------
        // Build Manager Logic (Hybrid Save/Share & Metrics)
        // ------------------------------------------------------------------

        function getVariantDetails(variantId) {
            let card = allCards.find(c => c.variants.includes(variantId));
            if (!card) return null;
            
            let vType = 'base';
            if (variantId.endsWith('rare')) vType = 'rare';
            else if (variantId.endsWith('b')) vType = 'b';
            else if (variantId.endsWith('a')) vType = 'a';
            
            let costStr = card.vCosts[vType];
            if (costStr === undefined) costStr = card.cost; // fallback to base cost if variant cost not found
            
            // Safely parse to an integer for metrics math, default to 0 if it's "N/A"
            let cost = parseInt(costStr, 10);
            if (isNaN(cost)) cost = 0;
            
            return { card, cost, vType };
        }

        function addCurrentVariantToBuild(baseId) {
            const img = document.getElementById(`main-img-${baseId}`);
            if (img) {
                const variantId = img.getAttribute('data-id');
                currentBuild.push(variantId);
                renderBuild();
            }
        }

        function removeFromBuild(index) {
            currentBuild.splice(index, 1);
            renderBuild();
        }

        function renderBuild() {
            const grid = document.getElementById('buildGrid');
            const metricsPanel = document.getElementById('buildMetrics');
            grid.innerHTML = '';
            
            if(currentBuild.length === 0) {
                grid.innerHTML = '<div style="color:#666; font-style:italic; padding: 10px;">Select cards to start building...</div>';
                metricsPanel.style.display = 'none';
                return;
            }

            metricsPanel.style.display = 'flex';

            // Auto-Sort: Lowest Cost -> Alphabetical
            currentBuild.sort((id1, id2) => {
                let d1 = getVariantDetails(id1);
                let d2 = getVariantDetails(id2);
                if (!d1 || !d2) return 0;
                
                if (d1.cost !== d2.cost) return d1.cost - d2.cost;
                return d1.card.idKey.localeCompare(d2.card.idKey);
            });

            // Metrics Trackers
            let totalCards = currentBuild.length;
            let totalCost = 0;
            let costCurve = {};
            let typeCounts = {};
            let allEffects = new Set();

            currentBuild.forEach((cardId, index) => {
                // Generate Tray UI
                const div = document.createElement('div');
                div.className = 'build-item';
                div.innerHTML = `
                    <img src="./card_images/${cardId}_result.png" alt="${cardId}" title="${cardId}">
                    <button class="remove-btn" onclick="removeFromBuild(${index})">x</button>
                `;
                grid.appendChild(div);

                // Calculate Metrics
                let d = getVariantDetails(cardId);
                if (d) {
                    totalCost += d.cost;
                    costCurve[d.cost] = (costCurve[d.cost] || 0) + 1;
                    
                    d.card.types.forEach(t => { typeCounts[t] = (typeCounts[t] || 0) + 1; });
                    d.card.auras.forEach(a => allEffects.add(a));
                    d.card.curses.forEach(c => allEffects.add(c));
                }
            });

            // Update Metrics UI
            document.getElementById('metricTotal').textContent = totalCards;
            document.getElementById('metricAvg').textContent = totalCards > 0 ? (totalCost / totalCards).toFixed(1) : "0.0";
            
            // Render Cost Curve
            let curveHtml = '';
            Object.keys(costCurve).sort((a,b)=>a-b).forEach(cost => {
                curveHtml += `<li><span>Cost ${cost}:</span> <strong>${costCurve[cost]}</strong></li>`;
            });
            document.getElementById('metricCurve').innerHTML = curveHtml;

            // Render Types
            let typesHtml = '';
            Object.keys(typeCounts).sort().forEach(type => {
                typesHtml += `<li><span>${type}:</span> <strong>${typeCounts[type]}</strong></li>`;
            });
            document.getElementById('metricTypes').innerHTML = typesHtml;

            // Render Effects
            let effectsHtml = '';
            Array.from(allEffects).sort().forEach(eff => {
                effectsHtml += `<span class="badge">${eff}</span>`;
            });
            document.getElementById('metricEffects').innerHTML = effectsHtml || '<span style="color:#666">None</span>';
        }

        // Local Storage & Link Generation Logic
        function saveBuildToLocal() {
            const name = document.getElementById('buildName').value.trim();
            if (!name) { alert("Please name your build before saving."); return; }
            if (currentBuild.length === 0) { alert("Add some cards before saving."); return; }

            let savedBuilds = JSON.parse(localStorage.getItem('ato_builds') || '{}');
            savedBuilds[name] = currentBuild;
            localStorage.setItem('ato_builds', JSON.stringify(savedBuilds));
            
            updateSavedBuildsDropdown();
            document.getElementById('savedBuildsDropdown').value = name;
        }

        function updateSavedBuildsDropdown() {
            const dropdown = document.getElementById('savedBuildsDropdown');
            const savedBuilds = JSON.parse(localStorage.getItem('ato_builds') || '{}');
            
            dropdown.innerHTML = '<option value="">-- Load Saved Build --</option>';
            for (const name in savedBuilds) {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                dropdown.appendChild(opt);
            }
        }

        function loadBuildFromLocal(name) {
            if (!name) return;
            const savedBuilds = JSON.parse(localStorage.getItem('ato_builds') || '{}');
            if (savedBuilds[name]) {
                currentBuild = [...savedBuilds[name]];
                document.getElementById('buildName').value = name;
                renderBuild();
                document.getElementById('shareLinkContainer').style.display = 'none';
            }
        }

        function generateShareLink() {
            if (currentBuild.length === 0) { alert("Add some cards to generate a link!"); return; }
            
            const name = encodeURIComponent(document.getElementById('buildName').value.trim() || 'Untitled');
            const cards = currentBuild.join(',');
            
            const baseUrl = window.location.origin + window.location.pathname;
            const finalUrl = `${baseUrl}?buildName=${name}&cards=${cards}`;
            
            const container = document.getElementById('shareLinkContainer');
            const input = document.getElementById('shareLinkInput');
            
            input.value = finalUrl;
            container.style.display = 'block';
            input.select();
            document.execCommand('copy'); 
        }

        function checkUrlForBuild() {
            const params = new URLSearchParams(window.location.search);
            const cards = params.get('cards');
            const name = params.get('buildName');
            
            if (cards) {
                currentBuild = cards.split(',').filter(c => c);
                if (name) document.getElementById('buildName').value = decodeURIComponent(name);
                // Clean the URL bar
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        // ------------------------------------------------------------------
        // UI & Dropdown Logic
        // ------------------------------------------------------------------

        function toggleSubMenu() {
            const cat = document.getElementById('categoryFilter').value;
            const subMenu = document.getElementById('advancedFilters');
            if (cat === 'normal' || cat === 'all') {
                subMenu.classList.remove('hidden');
            } else {
                subMenu.classList.add('hidden');
            }
        }

        function toggleDropdown(id, event) {
            event.stopPropagation();
            document.querySelectorAll('.dropdown-content').forEach(el => {
                if(el.id !== id) el.classList.remove('show');
            });
            document.getElementById(id).classList.toggle('show');
        }

        document.addEventListener('click', function(event) {
            if (!event.target.closest('.dropdown-content') && !event.target.closest('.select-box')) {
                document.querySelectorAll('.dropdown-content').forEach(el => el.classList.remove('show'));
            }
        });

        function createMultiSelect(containerId, title, optionsList, filterKey) {
            const container = document.getElementById(containerId);
            if (!optionsList || optionsList.length === 0) return;
            
            let sortedOptions = Array.from(optionsList).filter(o => o);
            if (title === 'Cost') {
                // Safely sort costs numerically, pushing "N/A" or text to the bottom
                sortedOptions.sort((a, b) => {
                    let numA = parseInt(a, 10);
                    let numB = parseInt(b, 10);
                    if (isNaN(numA)) numA = 999; 
                    if (isNaN(numB)) numB = 999;
                    return numA - numB;
                });
            } else {
                sortedOptions.sort();
            }

            let html = `<div class="multi-select">
                <div class="select-box" onclick="toggleDropdown('${containerId}-drop', event)">${title}</div>
                <div class="dropdown-content" id="${containerId}-drop">`;
            
            sortedOptions.forEach(opt => {
                html += `<label><input type="checkbox" value="${opt}" class="${filterKey}-checkbox" onchange="filterData()"> ${opt}</label>`;
            });
            
            html += `</div></div>`;
            container.innerHTML = html;
        }

        // ------------------------------------------------------------------
        // Data Parsing & Loading
        // ------------------------------------------------------------------

        function parseCSV(text) {
            const results = [];
            let current = [];
            let token = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const c = text[i];
                if (c === '"') {
                    if (inQuotes && text[i + 1] === '"') { token += '"'; i++; } 
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    current.push(token.trim()); token = '';
                } else if ((c === '\n' || c === '\r') && !inQuotes) {
                    if (c === '\r' && text[i + 1] === '\n') i++;
                    current.push(token.trim()); token = '';
                    if (current.length > 0) { results.push(current); current = []; }
                } else {
                    token += c;
                }
            }
            if (token || current.length > 0) { current.push(token.trim()); results.push(current); }
            return results;
        }

        async function loadData() {
            try {
                const response = await fetch('./cards.json'); 
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const rawText = await response.text();
                const cleanText = rawText.replace(/[\u00A0\u200B\u200C\u200D\uFEFF]/g, ' '); 
                
                let db;
                try {
                    db = JSON.parse(cleanText);
                } catch (parseError) {
                    throw new Error(`Syntax error in cards.json: ${parseError.message}`);
                }

                let statsMap = {};
                let typeHeaders = [], auraHeaders = [], curseHeaders = [];
                let uniqueClasses = new Set(), uniqueCosts = new Set(), uniqueRarities = new Set();
                
                try {
                    const csvRes = await fetch('./stats.csv');
                    if (csvRes.ok) {
                        const csvText = await csvRes.text();
                        const rows = parseCSV(csvText);
                        const headers = rows[0].map(h => h.trim());
                        
                        typeHeaders = headers.slice(7, 25).filter(h => h);
                        auraHeaders = headers.slice(25, 52).filter(h => h);
                        curseHeaders = headers.slice(52, 77).filter(h => h);

                        for (let i = 1; i < rows.length; i++) {
                            const row = rows[i];
                            if (!row[0]) continue;
                            
                            const cleanName = row[0].toLowerCase().trim();
                            
                            // Initialize master object for this card family
                            if (!statsMap[cleanName]) {
                                // Keep cost as a raw string to safely handle 'N/A'
                                let costStr = row[5] !== undefined && row[5] !== '' ? row[5].trim() : 'N/A';
                                
                                statsMap[cleanName] = {
                                    heroClass: row[4] || 'Other',
                                    cost: costStr,
                                    rarity: row[6] || 'Unknown',
                                    types: new Set(),
                                    auras: new Set(),
                                    curses: new Set(),
                                    vCosts: {}
                                };
                                if(row[4]) uniqueClasses.add(row[4]);
                                uniqueCosts.add(costStr);
                                if(row[6]) uniqueRarities.add(row[6]);
                            }

                            // Track specific variant costs
                            let vType = 'base';
                            if (row[1] && row[1].toUpperCase() === 'TRUE') vType = 'a';
                            else if (row[2] && row[2].toUpperCase() === 'TRUE') vType = 'b';
                            else if (row[3] && row[3].toUpperCase() === 'TRUE') vType = 'rare';
                            
                            if (row[5] !== undefined && row[5] !== '') {
                                statsMap[cleanName].vCosts[vType] = row[5].trim();
                            }

                            // Aggregate Arrays (using Set to ensure unique values across all variants)
                            for(let j=7; j<=24; j++) if(row[j] && row[j].toUpperCase() === 'TRUE') statsMap[cleanName].types.add(headers[j]);
                            for(let j=25; j<=51; j++) if(row[j] && row[j].toUpperCase() === 'TRUE') statsMap[cleanName].auras.add(headers[j]);
                            for(let j=52; j<=76; j++) if(row[j] && row[j].toUpperCase() === 'TRUE') statsMap[cleanName].curses.add(headers[j]);
                        }
                    }
                } catch(e) { console.log("stats.csv not found."); }

                createMultiSelect('classFilterContainer', 'Class', uniqueClasses, 'class');
                createMultiSelect('costFilterContainer', 'Cost', uniqueCosts, 'cost');
                createMultiSelect('rarityFilterContainer', 'Rarity', uniqueRarities, 'rarity');
                createMultiSelect('typeFilterContainer', 'Card Type', typeHeaders, 'type');
                createMultiSelect('auraFilterContainer', 'Auras', auraHeaders, 'aura');
                createMultiSelect('curseFilterContainer', 'Curses', curseHeaders, 'curse');

                const categories = new Set();
                allCards = []; // Reset array

                Object.entries(db.cards).forEach(([key, data]) => {
                    let category = "normal";
                    let cleanName = key;
                    
                    const match = key.match(/\(([^)]+)\)/);
                    if (match) {
                        category = match[1].toLowerCase();
                        cleanName = key.replace(/\([^)]+\)/g, '').trim();
                    }
                    
                    const sheetData = statsMap[cleanName.toLowerCase()];
                    
                    // JUNK DATA RULE: If it's a normal card but missing from our spreadsheet, throw it out.
                    if (category === "normal" && !sheetData) {
                        return; 
                    }
                    
                    categories.add(category);
                    
                    const safeSheetData = sheetData || { 
                        heroClass: 'Other', cost: 'N/A', rarity: 'Unknown', types: new Set(), auras: new Set(), curses: new Set(), vCosts: {} 
                    };

                    allCards.push({
                        idKey: cleanName,
                        category: category,
                        heroClass: safeSheetData.heroClass,
                        cost: safeSheetData.cost,
                        rarity: safeSheetData.rarity,
                        types: Array.from(safeSheetData.types),
                        auras: Array.from(safeSheetData.auras),
                        curses: Array.from(safeSheetData.curses),
                        vCosts: safeSheetData.vCosts,
                        variants: data.IDs || [], 
                        related: data.RelatedIDs || []
                    });
                });
                
                // MAIN MENU AUTO SORT: Alphabetical
                allCards.sort((a, b) => a.idKey.localeCompare(b.idKey));

                const categorySelect = document.getElementById('categoryFilter');
                Array.from(categories).filter(c => c !== 'normal').sort().forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
                    categorySelect.appendChild(option);
                });

                // Init actions
                updateSavedBuildsDropdown();
                checkUrlForBuild();
                renderBuild();
                filterData(); 

            } catch (error) {
                const errorDiv = document.getElementById('error-message');
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = `<h3>Failed to load application data</h3><p style="font-size: 0.9em; color: #ccc;">${error.message}</p>`;
            }
        }

        // ------------------------------------------------------------------
        // Rendering & Filtering
        // ------------------------------------------------------------------

        function getBorderClass(variantId, baseId) {
            if (variantId.endsWith('rare')) return 'border-rare';
            if (variantId.endsWith('b') && variantId !== baseId + 'b' + 'b') return 'border-b'; // basic catch for ending in b
            if (variantId.endsWith('a') && variantId !== baseId + 'a' + 'a') return 'border-a';
            return 'border-base';
        }

        function renderCards(cardsToRender) {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = ''; 

            cardsToRender.forEach(card => {
                if (card.variants.length === 0) return;

                const baseId = card.variants[0]; 
                const upgrades = card.variants.slice(1); 

                const cardDiv = document.createElement('div');
                cardDiv.className = 'card-container';
                
                let htmlStr = `<h3 class="card-title">${card.idKey}</h3>`;
                htmlStr += `<img src="./card_images/${baseId}_result.png" class="main-img" id="main-img-${baseId}" alt="${baseId}" data-id="${baseId}" onerror="handleImageError(this)">`;
                
                if (upgrades.length > 0) {
                    htmlStr += `<div class="variants">`;
                    htmlStr += `<img class="variant-img border-base active" id="thumb-${baseId}-${baseId}" src="./card_images/${baseId}_result.png" onclick="swapImage('${baseId}', '${baseId}')" onerror="handleImageError(this)">`;
                    upgrades.forEach(upgradeId => {
                        let borderCls = getBorderClass(upgradeId, baseId);
                        htmlStr += `<img class="variant-img ${borderCls}" id="thumb-${baseId}-${upgradeId}" src="./card_images/${upgradeId}_result.png" onclick="swapImage('${baseId}', '${upgradeId}')" onerror="handleImageError(this)">`;
                    });
                    htmlStr += `</div>`;
                }

                // Add to Build Button
                htmlStr += `<button class="add-btn" onclick="addCurrentVariantToBuild('${baseId}')">+ Add to Build</button>`;

                cardDiv.innerHTML = htmlStr;
                grid.appendChild(cardDiv);
            });
        }

        function swapImage(baseId, newId) {
            const mainImgElement = document.getElementById(`main-img-${baseId}`);
            
            if(mainImgElement.tagName === 'IMG') {
               mainImgElement.src = `./card_images/${newId}_result.png`;
               mainImgElement.setAttribute('data-id', newId);
            } else {
               const newImg = document.createElement('img');
               newImg.src = `./card_images/${newId}_result.png`;
               newImg.id = `main-img-${baseId}`;
               newImg.className = 'main-img';
               newImg.setAttribute('data-id', newId);
               newImg.onerror = function() { handleImageError(this) };
               mainImgElement.parentNode.replaceChild(newImg, mainImgElement);
            }
            
            const variantsContainer = document.getElementById(`thumb-${baseId}-${newId}`).parentElement;
            const thumbs = variantsContainer.querySelectorAll('.variant-img');
            thumbs.forEach(t => t.classList.remove('active'));
            document.getElementById(`thumb-${baseId}-${newId}`).classList.add('active');
        }

        function filterData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const selectedCategory = document.getElementById('categoryFilter').value;
            
            const getChecked = (className) => Array.from(document.querySelectorAll(`.${className}:checked`)).map(cb => cb.value);
            
            const selectedClasses = getChecked('class-checkbox');
            const selectedCosts = getChecked('cost-checkbox'); // Keep as strings to match "N/A" safely
            const selectedRarities = getChecked('rarity-checkbox');
            const selectedTypes = getChecked('type-checkbox');
            const selectedAuras = getChecked('aura-checkbox');
            const selectedCurses = getChecked('curse-checkbox');

            const filtered = allCards.filter(card => {
                const matchesSearch = card.idKey.toLowerCase().includes(searchTerm) || 
                                      card.variants.join(' ').toLowerCase().includes(searchTerm);
                if (!matchesSearch) return false;
                if (selectedCategory !== 'all' && card.category !== selectedCategory) return false;

                if (selectedCategory === 'normal' || selectedCategory === 'all') {
                    if (selectedClasses.length > 0 && !selectedClasses.includes(card.heroClass)) return false;
                    // Safely compare cost properties as strings
                    if (selectedCosts.length > 0 && !selectedCosts.includes(card.cost.toString())) return false;
                    if (selectedRarities.length > 0 && !selectedRarities.includes(card.rarity)) return false;
                    
                    if (selectedTypes.length > 0 && !selectedTypes.some(t => card.types.includes(t))) return false;
                    if (selectedAuras.length > 0 && !selectedAuras.some(a => card.auras.includes(a))) return false;
                    if (selectedCurses.length > 0 && !selectedCurses.some(c => card.curses.includes(c))) return false;
                }
                return true;
            });

            renderCards(filtered);
        }

    </script>
</body>
</html>
