<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tome of Knowledge</title>
    <style>
        body { font-family: sans-serif; background: #1e1e1e; color: #eee; padding: 20px; }
        .controls { display: flex; gap: 15px; margin-bottom: 20px; background: #2d2d2d; padding: 15px; border-radius: 8px; }
        input, select { padding: 8px; border-radius: 4px; border: 1px solid #444; background: #111; color: white; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card-container { background: #2d2d2d; padding: 10px; border-radius: 8px; text-align: center; }
        
        /* Variants container hidden by default, shown on hover/click */
        .variants { display: flex; gap: 5px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
        img { max-width: 100%; height: auto; border-radius: 4px; }
        .variant-img { width: 60px; cursor: pointer; transition: transform 0.2s; }
        .variant-img:hover { transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search cards..." oninput="filterData()">
        
        <select id="typeFilter" onchange="filterData()">
            <option value="all">All Types</option>
            <option value="melee">Melee</option>
            <option value="spell">Spell</option>
            </select>
    </div>

    <div class="grid" id="cardGrid">
        </div>

    <script>
        let allCards = []; // Master data array

        // Phase 1: Fetch and normalize the data
        async function loadData() {
            try {
                // In production, this points to your giant JSON file
                const response = await fetch('./data.json'); 
                const db = await response.json();
                
                // Convert the JSON object into an iterable array
                allCards = Object.entries(db.cards).map(([key, data]) => {
                    return {
                        idKey: key,
                        // Pulling the array of IDs you highlighted
                        variants: data.IDs || [], 
                        related: data.RelatedIDs || [],
                        // Assuming your JSON has these for filtering:
                        type: data.type || 'unknown',
                        cost: data.cost || 0
                    };
                });

                renderCards(allCards);
            } catch (error) {
                console.error("Error loading JSON. Are you running a local server?", error);
            }
        }

        // Render the UI
        function renderCards(cardsToRender) {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = ''; // Clear current grid

            cardsToRender.forEach(card => {
                if (card.variants.length === 0) return;

                const baseId = card.variants[0]; // The standard un-upgraded card
                const upgrades = card.variants.slice(1); // The a, b, and rare upgrades

                // Create the card block
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card-container';
                
                // The main image
                let htmlStr = `<img src="./images/${baseId}.png" id="main-img-${baseId}" alt="${baseId}">`;
                
                // Phase 3: Upgraded Variants side-by-side
                if (upgrades.length > 0) {
                    htmlStr += `<div class="variants">`;
                    htmlStr += `<img class="variant-img" src="./images/${baseId}.png" onclick="swapImage('${baseId}', '${baseId}')">`;
                    upgrades.forEach(upgradeId => {
                        htmlStr += `<img class="variant-img" src="./images/${upgradeId}.png" onclick="swapImage('${baseId}', '${upgradeId}')">`;
                    });
                    htmlStr += `</div>`;
                }

                cardDiv.innerHTML = htmlStr;
                grid.appendChild(cardDiv);
            });
        }

        // Handle variant clicking to swap the main image
        function swapImage(baseId, newId) {
            document.getElementById(`main-img-${baseId}`).src = `./images/${newId}.png`;
        }

        // Phase 3: The Filter Engine
        function filterData() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const typeFilter = document.getElementById('typeFilter').value;

            const filtered = allCards.filter(card => {
                // Check Global Search
                const matchesSearch = card.idKey.toLowerCase().includes(searchTerm) || 
                                      card.variants.join(' ').toLowerCase().includes(searchTerm);
                
                // Check Facets
                const matchesType = typeFilter === 'all' || card.type === typeFilter;

                return matchesSearch && matchesType;
            });

            renderCards(filtered);
        }

        // Initialize the app
        loadData();
    </script>
</body>
</html>
